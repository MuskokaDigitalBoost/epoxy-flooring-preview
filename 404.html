<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0d0f0e">
    <title>Page Not Found | Northline Floor Co.</title>
    <link rel="stylesheet" href="/assets/epoxy.css">
    <style>
      .error-page{min-height:100svh;display:grid;place-items:center;padding:40px;background:radial-gradient(circle at 70% 20%,rgba(217,164,65,.17),transparent 34%),#0d0f0e}.error-card{width:min(100%,760px);padding:clamp(34px,7vw,78px);border:1px solid rgba(255,255,255,.14);border-radius:28px;background:rgba(255,255,255,.04);text-align:center}.error-card .section-kicker{color:#efba54}.error-card h1{margin:0;font-size:clamp(4rem,11vw,8rem);line-height:.85;letter-spacing:-.07em}.error-card p{max-width:470px;margin:28px auto;color:rgba(255,255,255,.58);line-height:1.65}
    </style>
  </head>
  <body>
    <main class="error-page">
      <div class="error-card">
        <p class="section-kicker">Error 404</p>
        <h1>Wrong<br><em>surface.</em></h1>
        <p>This page does not exist in the Northline Floor Co. concept.</p>
        <a class="button button-primary" href="/">Return home <span aria-hidden="true">↗</span></a>
      </div>
    </main>
  </body>
</html>
